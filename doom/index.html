<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Doom</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #eee;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #root {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #000;
        outline: none;
      }
      #status {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 6px 10px;
        background: rgba(0, 0, 0, 0.7);
        border-radius: 4px;
        pointer-events: none;
        white-space: pre-line;
        max-width: 80%;
      }
      #status.hidden {
        display: none;
      }
      #start {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.8);
        cursor: pointer;
        user-select: none;
        font-size: 14px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      #start.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <canvas id="canvas" tabindex="0"></canvas>
    </div>
    <div id="status">Loading…</div>
    <div id="start">Click to start</div>

    <script>
      const statusEl = document.getElementById("status");
      const startEl = document.getElementById("start");
      const canvas = document.getElementById("canvas");

      function setStatus(text) {
        if (!text) {
          statusEl.classList.add("hidden");
          return;
        }
        statusEl.classList.remove("hidden");
        statusEl.textContent = text;
      }

      // Doomgeneric's SDL renderer doesn't auto-resize on canvas style
      // changes — it uses the canvas backing-store dimensions. We don't
      // resize after start; SDL set the buffer to 320x200 (then upscaled
      // via CSS via image-rendering: pixelated).

      let moduleInstance = null;
      const Module = {
        canvas,
        noInitialRun: true,
        arguments: [],
        preRun: [],
        postRun: [],
        print: (...args) => console.log("[doom]", ...args),
        printErr: (...args) => console.warn("[doom err]", ...args),
        setStatus,
        onAbort: (reason) => {
          setStatus("Doom aborted: " + reason);
        },
      };

      function start() {
        startEl.classList.add("hidden");
        canvas.focus();
        if (!moduleInstance) return;
        try {
          moduleInstance.callMain([]);
          setStatus("");
        } catch (err) {
          // Emscripten throws 'unwind' to keep the main loop alive.
          if (err && err.toString && err.toString().includes("unwind")) {
            setStatus("");
            return;
          }
          console.error(err);
          setStatus("Doom crashed: " + err);
        }
      }

      startEl.addEventListener("click", start);

      // Keep focus on the canvas so SDL gets keystrokes.
      window.addEventListener("focus", () => canvas.focus());
      canvas.addEventListener("click", () => canvas.focus());

      // WASD → modern FPS layout. W/S = forward/back (arrows), A/D = strafe
      // (Doom's default strafe-left/right keys are ',' and '.'). Arrow keys
      // still work natively, so Left/Right can be used for turning.
      const KEY_REMAP = {
        KeyW: { code: "ArrowUp", key: "ArrowUp", keyCode: 38 },
        KeyS: { code: "ArrowDown", key: "ArrowDown", keyCode: 40 },
        KeyA: { code: "Comma", key: ",", keyCode: 188 },
        KeyD: { code: "Period", key: ".", keyCode: 190 },
      };

      function dispatchKey(type, spec) {
        const ev = new KeyboardEvent(type, {
          code: spec.code,
          key: spec.key,
          keyCode: spec.keyCode,
          which: spec.keyCode,
          bubbles: true,
          cancelable: true,
        });
        window.dispatchEvent(ev);
      }

      function remapKey(e) {
        const mapped = KEY_REMAP[e.code];
        if (!mapped) {
          // Still swallow scroll keys (arrows / space) so the page doesn't move.
          if (
            ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(
              e.key,
            )
          ) {
            e.preventDefault();
          }
          return;
        }
        e.preventDefault();
        e.stopImmediatePropagation();
        if (e.repeat) return;
        dispatchKey(e.type, mapped);
      }
      window.addEventListener("keydown", remapKey, {
        capture: true,
        passive: false,
      });
      window.addEventListener("keyup", remapKey, {
        capture: true,
        passive: false,
      });

      // Left mouse click → fire (Doom default fire is Ctrl).
      const FIRE_KEY = {
        code: "ControlLeft",
        key: "Control",
        keyCode: 17,
      };
      const TURN_LEFT = { code: "ArrowLeft", key: "ArrowLeft", keyCode: 37 };
      const TURN_RIGHT = { code: "ArrowRight", key: "ArrowRight", keyCode: 39 };

      let firing = false;
      canvas.addEventListener("mousedown", (e) => {
        if (e.button !== 0) return;
        e.preventDefault();
        // Request pointer lock on click so mouse can turn the view.
        if (document.pointerLockElement !== canvas) {
          canvas.requestPointerLock?.();
        }
        if (firing) return;
        firing = true;
        dispatchKey("keydown", FIRE_KEY);
      });
      const releaseFire = (e) => {
        if (!firing) return;
        if (e && e.button !== undefined && e.button !== 0) return;
        firing = false;
        dispatchKey("keyup", FIRE_KEY);
      };
      window.addEventListener("mouseup", releaseFire);
      window.addEventListener("blur", () => releaseFire());
      canvas.addEventListener("contextmenu", (e) => e.preventDefault());

      // Mouse-look: convert horizontal pointer motion into synthetic
      // Left/Right arrow holds. We synthesize key events instead of relying
      // on Doom's SDL mouse-turn so we can ignore Y motion (which would
      // otherwise also drive forward/back and fight with W/S).
      const TURN_SENSITIVITY = 0.6; // how fast pixels of motion accumulate
      const TURN_DEADZONE = 0.5; // px-equivalent below which we release keys
      const TURN_DECAY = 0.82; // per-frame falloff so keys release when still
      let turnAccum = 0;
      let turnHeld = 0; // -1 left, 0 none, +1 right

      function releaseTurn() {
        if (turnHeld === -1) dispatchKey("keyup", TURN_LEFT);
        else if (turnHeld === 1) dispatchKey("keyup", TURN_RIGHT);
        turnHeld = 0;
      }

      function turnLoop() {
        if (document.pointerLockElement === canvas) {
          if (turnAccum > TURN_DEADZONE && turnHeld !== 1) {
            releaseTurn();
            turnHeld = 1;
            dispatchKey("keydown", TURN_RIGHT);
          } else if (turnAccum < -TURN_DEADZONE && turnHeld !== -1) {
            releaseTurn();
            turnHeld = -1;
            dispatchKey("keydown", TURN_LEFT);
          } else if (
            Math.abs(turnAccum) <= TURN_DEADZONE &&
            turnHeld !== 0
          ) {
            releaseTurn();
          }
          turnAccum *= TURN_DECAY;
        }
        requestAnimationFrame(turnLoop);
      }
      requestAnimationFrame(turnLoop);

      window.addEventListener("mousemove", (e) => {
        if (document.pointerLockElement !== canvas) return;
        turnAccum += e.movementX * TURN_SENSITIVITY;
      });

      document.addEventListener("pointerlockchange", () => {
        if (document.pointerLockElement !== canvas) {
          turnAccum = 0;
          releaseTurn();
        }
      });

      // Load the doom module.
      setStatus("Loading doomgeneric…");
      const script = document.createElement("script");
      script.src = "./doomgeneric.js";
      script.onload = () => {
        if (typeof createDoomModule !== "function") {
          setStatus("doomgeneric.js loaded but no createDoomModule");
          return;
        }
        createDoomModule(Module).then((mod) => {
          moduleInstance = mod;
          setStatus("Ready. Click to start.");
          startEl.classList.remove("hidden");
        });
      };
      script.onerror = () => {
        setStatus(
          "Failed to load doomgeneric.js.\nDid you run the build? See vendor/doomgeneric/doomgeneric/Makefile.web.",
        );
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
